name: Bug report
description: Report a reproducible problem using synthetic examples only.
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, real conversations, account files, private paths, or raw diagnostic bundles. For vulnerabilities, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction with synthetic data
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
